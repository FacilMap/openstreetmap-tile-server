<!DOCTYPE html>
<html>
    <head>
        <title>Custom Tile Server</title>

        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="https://esm.sh/leaflet@1.9.4/dist/leaflet.css" />

        <style>
            html, body, #map {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
            }
        </style>

        <script type="importmap">
			{
				"imports": {
					"leaflet": "https://esm.sh/leaflet"
				}
			}
		</script>
    </head>

    <body>
        <div id="map"></div>

        <script type="module">
            import * as L from "leaflet";

            const map = L.map('map').setView([0, 0], 3);

            const maps = (await fetch("./maps.txt").then((res) => res.text())).split("\n").filter((m) => m);

            const attribution = 'Map data &copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a> contributors, <a href="https://creativecommons.org/licenses/by-sa/2.0/">CC-BY-SA</a>';
            new L.Control.Layers({}, {
                Mapnik: new L.TileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution }),
                ...Object.fromEntries(maps.map((m) => [m, new L.TileLayer(`/${encodeURIComponent(m)}/{z}/{x}/{y}.png`, { maxZoom: 23, attribution })]))
            }, {
                collapsed: false
            }).addTo(map);
        </script>
    </body>
</html>
